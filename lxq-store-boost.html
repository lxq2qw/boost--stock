<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boost Stock</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at 20% 20%, #7a0000, #1a0000 70%);
  color:#fff;
  overflow:hidden;
}

/* Glow خلفية خفيف */
body::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:rgba(255,0,0,0.15);
  filter:blur(120px);
  border-radius:50%;
  top:-100px;
  left:-100px;
}

/* Container */
.container{
  width:1100px;
  padding:40px;
  border-radius:30px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(25px);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 60px rgba(0,0,0,0.7);
  position:relative;
  z-index:2;
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.header h2{
  font-weight:600;
  font-size:24px;
  letter-spacing:1px;
}

.live{
  padding:10px 20px;
  border-radius:25px;
  background:rgba(0,255,120,0.08);
  border:1px solid rgba(0,255,120,0.3);
  color:#4dff9a;
  font-size:14px;
}

/* Cards */
.cards{
  display:flex;
  gap:30px;
}

.card{
  flex:1;
  padding:45px;
  border-radius:30px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.07);
  text-align:center;
  position:relative;
  transition:0.4s ease;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 40px rgba(255,0,0,0.3);
}

/* Icon */
.icon{
  width:70px;
  height:70px;
  margin:0 auto 25px;
  background:linear-gradient(135deg,#8b0000,#ff0000);
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 0 25px rgba(255,0,0,0.4);
}

/* Titles */
.card h4{
  letter-spacing:2px;
  font-size:14px;
  color:#ccc;
  margin-bottom:20px;
}

/* Number */
.number{
  font-size:60px;
  font-weight:700;
  background:linear-gradient(90deg,#ff1a1a,#ffffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:25px;
}

/* Progress */
.progress{
  height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.progress span{
  display:block;
  height:100%;
  width:90%;
  background:linear-gradient(90deg,#ff0000,#ffffff);
  border-radius:20px;
  animation:load 2s ease forwards;
}

@keyframes load{
  from{width:0;}
  to{width:90%;}
}

.small{
  font-size:14px;
  color:#ddd;
}

</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>🔥 Boost Stock</h2>
    <div class="live">● Live Updates</div>
  </div>

  <div class="cards">
    
    <div class="card">
      <div class="icon">📅</div>
      <h4>1 MONTH BOOSTS</h4>
      <div class="number">متوفر</div>
      <div class="progress"><span></span></div>
      <div class="small">Available to use</div>
    </div>

    <div class="card">
      <div class="icon">📋</div>
      <h4>3 MONTH BOOSTS</h4>
      <div class="number">متوفر</div>
      <div class="progress"><span style="width:75%"></span></div>
      <div class="small">Available to use</div>
    </div>

  </div>
</div>

</body>
</html>
